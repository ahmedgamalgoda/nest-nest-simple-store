services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: simple_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: simple_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_store"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - store-network

  # ----------------------------------------------------
  # NestJS Backend API Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simple_store_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/simple_store?schema=public
      JWT_SECRET: super-secret-jwt-key-for-simple-store
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store-network

# ----------------------------------------------------
# Persistent Named Volumes
# ----------------------------------------------------
volumes:
  postgres_data:
    name: simple_store_postgres_data

# ----------------------------------------------------
# Dedicated Docker Bridge Network
# ----------------------------------------------------
networks:
  store-network:
    name: simple_store_network
    driver: bridge
